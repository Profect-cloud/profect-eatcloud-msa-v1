name: ECR + ECS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECS_CLUSTER_STAGING: eatcloud-cluster
  ECS_CLUSTER_PRODUCTION: eatcloud-cluster

jobs:
  # 변경된 서비스 감지
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR의 경우 base 브랜치와 비교
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            # Push의 경우 이전 커밋과 비교
            changed_files=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Changed files:"
          echo "$changed_files"
          
          services=()
          
          # 각 서비스별로 변경사항 확인 (eureka-server, api-gateway 제외)
          for service in auth-service customer-service admin-service manager-service store-service order-service payment-service; do
            if echo "$changed_files" | grep -q "^$service/"; then
              services+=("$service")
            fi
          done
          
          # 루트 레벨 변경사항 (모든 서비스에 영향)
          if echo "$changed_files" | grep -qE "^(build\.gradle|settings\.gradle|docker-compose\.yml|gradle/|\.github/workflows/)"; then
            services=(auth-service customer-service admin-service manager-service store-service order-service payment-service)
          fi
          
          # 최초 커밋이나 서비스가 없는 경우 모든 서비스 빌드
          if [ ${#services[@]} -eq 0 ]; then
            services=(auth-service customer-service admin-service manager-service store-service order-service payment-service)
          fi
          
          # JSON 배열로 변환
          services_json=$(printf '%s\n' "${services[@]}" | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services_json" >> $GITHUB_OUTPUT
          
          # Matrix 전략을 위한 형태로 변환
          matrix_json=$(printf '%s\n' "${services[@]}" | jq -R -s -c '{"service": split("\n")[:-1]}')
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          
          # 변경사항 여부
          if [ ${#services[@]} -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Detected services: $services_json"

  # 테스트 및 빌드
  test-and-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.detect-changes.outputs.matrix)}}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test ${{ matrix.service }}
        run: ./gradlew :${{ matrix.service }}:test
        continue-on-error: true

      - name: Build ${{ matrix.service }}
        run: ./gradlew :${{ matrix.service }}:bootJar

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}/build/reports/tests/
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}/build/libs/*.jar
          retention-days: 30

  # ECR에 Docker 이미지 빌드 및 푸시
  build-and-push-ecr:
    needs: [detect-changes, test-and-build]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.detect-changes.outputs.matrix)}}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}/build/libs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names eatcloud/${{ matrix.service }} || \
          aws ecr create-repository \
            --repository-name eatcloud/${{ matrix.service }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 짧은 SHA 값을 별도 스텝에서 생성
      - name: Generate short SHA
        id: short-sha
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/eatcloud/${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/eatcloud/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/eatcloud/${{ matrix.service }}:${{ steps.short-sha.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      - name: Scan image for vulnerabilities
        run: |
          aws ecr start-image-scan --repository-name eatcloud/${{ matrix.service }} --image-id imageTag=latest || true

  # Staging Blue/Green 배포 (develop 브랜치)
  deploy-staging-blue-green:
    needs: [detect-changes, build-and-push-ecr]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix: ${{fromJson(needs.detect-changes.outputs.matrix)}}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 현재 활성 Target Group 확인
      - name: Check Current Active Target Group
        id: check-tg
        run: |
          # ALB Listener Rules를 확인하여 현재 활성 TG 파악
          BLUE_TG="${{ matrix.service }}-tg"
          GREEN_TG="${{ matrix.service }}-greentg"
          
          # ALB ARN 가져오기 (서비스별로 다를 수 있음)
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName, 'eatcloud')].LoadBalancerArn" \
            --output text)
          
          # 현재 활성 TG 확인 (첫 번째 Listener의 기본 Action 기준)
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --load-balancer-arn $ALB_ARN \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          
          CURRENT_TG_NAME=$(aws elbv2 describe-target-groups \
            --target-group-arns $CURRENT_TG \
            --query "TargetGroups[0].TargetGroupName" --output text)
          
          if [[ "$CURRENT_TG_NAME" == "$BLUE_TG" ]]; then
            TARGET_TG="$GREEN_TG"
            INACTIVE_TG="$GREEN_TG"
            ACTIVE_TG="$BLUE_TG"
            echo "🔵 Current: Blue ($BLUE_TG) → Deploying to: Green ($GREEN_TG)"
          else
            TARGET_TG="$BLUE_TG" 
            INACTIVE_TG="$BLUE_TG"
            ACTIVE_TG="$GREEN_TG"
            echo "🟢 Current: Green ($GREEN_TG) → Deploying to: Blue ($BLUE_TG)"
          fi
          
          echo "TARGET_TG=$TARGET_TG" >> $GITHUB_OUTPUT
          echo "INACTIVE_TG=$INACTIVE_TG" >> $GITHUB_OUTPUT
          echo "ACTIVE_TG=$ACTIVE_TG" >> $GITHUB_OUTPUT
          echo "ALB_ARN=$ALB_ARN" >> $GITHUB_OUTPUT

      # 새 Task Definition 생성 및 비활성 환경 업데이트
      - name: Update Task Definition and Deploy to Inactive Environment
        id: task-def
        run: |
          # 현재 Task Definition 가져오기
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition eatcloud-${{ matrix.service }}-staging \
            --query 'taskDefinition' \
            --output json)
          
          # 새 이미지 URI로 Task Definition 업데이트
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/eatcloud/${{ matrix.service }}:${{ github.sha }}"
          
          echo $TASK_DEF | jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE | 
             del(.taskDefinitionArn) | del(.revision) | del(.status) | 
             del(.requiresAttributes) | del(.placementConstraints) | 
             del(.compatibilities) | del(.registeredAt) | del(.registeredBy)' > new-task-def.json
          
          # 새 Task Definition 등록
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          
          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "📋 New Task Definition: $NEW_TASK_DEF_ARN"
          
          # ECS 서비스 업데이트 (비활성 Target Group으로)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_STAGING }} \
            --service ${{ matrix.service }} \
            --task-definition $NEW_TASK_DEF_ARN \
            --force-new-deployment

      # 배포 완료 대기
      - name: Wait for New Version Deployment
        run: |
          echo "⏳ Waiting for new version to be deployed..."
          
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER_STAGING }} \
            --services ${{ matrix.service }}
          
          # 서비스 상태 확인
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_STAGING }} \
            --services ${{ matrix.service }} \
            --query 'services[0].status' --output text)
          
          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_STAGING }} \
            --services ${{ matrix.service }} \
            --query 'services[0].runningCount' --output text)
          
          echo "✅ New version deployed - Service Status: $SERVICE_STATUS, Running Tasks: $RUNNING_COUNT"

      # Health Check 및 Target Group 상태 확인
      - name: Health Check on Inactive Target Group
        run: |
          echo "🔍 Performing health checks on inactive environment..."
          
          # Target Group ARN 가져오기
          TARGET_TG_ARN=$(aws elbv2 describe-target-groups \
            --names ${{ steps.check-tg.outputs.INACTIVE_TG }} \
            --query 'TargetGroups[0].TargetGroupArn' --output text)
          
          # Health Check 상태 확인 (최대 10분 대기)
          for i in {1..20}; do
            HEALTHY_COUNT=$(aws elbv2 describe-target-health \
              --target-group-arn $TARGET_TG_ARN \
              --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' --output text)
            
            TOTAL_COUNT=$(aws elbv2 describe-target-health \
              --target-group-arn $TARGET_TG_ARN \
              --query 'length(TargetHealthDescriptions)' --output text)
            
            echo "Health Check $i/20: $HEALTHY_COUNT/$TOTAL_COUNT targets healthy"
            
            if [ "$HEALTHY_COUNT" -gt 0 ] && [ "$HEALTHY_COUNT" = "$TOTAL_COUNT" ]; then
              echo "✅ All targets are healthy!"
              break
            fi
            
            if [ $i -eq 20 ]; then
              echo "❌ Health check timeout - some targets are still unhealthy"
              exit 1
            fi
            
            sleep 30
          done

      # ALB Listener 규칙 업데이트 (트래픽 전환)
      - name: Switch Traffic to New Version
        run: |
          echo "🔄 Switching traffic to new version..."
          
          # Target Group ARN 가져오기
          NEW_TG_ARN=$(aws elbv2 describe-target-groups \
            --names ${{ steps.check-tg.outputs.INACTIVE_TG }} \
            --query 'TargetGroups[0].TargetGroupArn' --output text)
          
          # Listener ARN 가져오기
          LISTENER_ARN=$(aws elbv2 describe-listeners \
            --load-balancer-arn ${{ steps.check-tg.outputs.ALB_ARN }} \
            --query 'Listeners[0].ListenerArn' --output text)
          
          # Listener의 기본 Action 업데이트
          aws elbv2 modify-listener \
            --listener-arn $LISTENER_ARN \
            --default-actions Type=forward,TargetGroupArn=$NEW_TG_ARN
          
          echo "✅ Traffic switched to ${{ steps.check-tg.outputs.INACTIVE_TG }}"

      # 배포 완료 확인
      - name: Verify Blue/Green Deployment
        run: |
          echo "🎉 Blue/Green deployment completed successfully!"
          echo "📊 Deployment Summary:"
          echo "  - Service: ${{ matrix.service }}"
          echo "  - Previous Target Group: ${{ steps.check-tg.outputs.ACTIVE_TG }}"
          echo "  - Current Target Group: ${{ steps.check-tg.outputs.INACTIVE_TG }}"
          echo "  - New Image: ${{ env.ECR_REGISTRY }}/eatcloud/${{ matrix.service }}:${{ github.sha }}"
          echo "  - Task Definition: ${{ steps.task-def.outputs.NEW_TASK_DEF_ARN }}"

  # Production 수동 배포 준비 알림
  production-deploy-ready:
    needs: [detect-changes, build-and-push-ecr]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Production Blue/Green deployment notification
        run: |
          echo "🚀 Production Blue/Green deployment ready!"
          echo "Services: ${{ needs.detect-changes.outputs.services }}"
          echo "Image SHA: ${{ github.sha }}"
          echo "ECR Images:"
          echo "${{ needs.detect-changes.outputs.services }}" | jq -r '.[]' | while read service; do
            echo "  - ${{ env.ECR_REGISTRY }}/eatcloud/${service}:${{ github.sha }}"
          done
          echo ""
          echo "Blue/Green deployment features:"
          echo "  ✅ Zero-downtime deployment"
          echo "  ✅ Automatic health checks"
          echo "  ✅ Traffic switching with ALB Target Groups"  
          echo "  ✅ Instant rollback capability"
          echo ""
          echo "Target Groups per service:"
          echo "${{ needs.detect-changes.outputs.services }}" | jq -r '.[]' | while read service; do
            echo "  - ${service}: Blue (${service}-tg) ↔ Green (${service}-greentg)"
          done
          echo ""
          echo "To deploy to production:"
          echo "1. Go to Actions tab"
          echo "2. Run 'Deploy to Production (Blue/Green)' workflow"
          echo "3. Select services and image tag: ${{ github.sha }}"