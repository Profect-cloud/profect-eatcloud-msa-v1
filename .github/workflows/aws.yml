name: ECR + ECS CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  ECS_CLUSTER_STAGING: eatcloud-cluster
  ECS_CLUSTER_PRODUCTION: eatcloud-cluster

jobs:
  # 변경된 서비스 감지
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR의 경우 base 브랜치와 비교
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            # Push의 경우 이전 커밋과 비교
            changed_files=$(git diff --name-only HEAD~1 HEAD)
          fi
          
          echo "Changed files:"
          echo "$changed_files"
          
          services=()
          
          # 각 서비스별로 변경사항 확인 (eureka-server, api-gateway 제외)
          for service in auth-service customer-service admin-service manager-service store-service order-service payment-service; do
            if echo "$changed_files" | grep -q "^$service/"; then
              services+=("$service")
            fi
          done
          
          # 루트 레벨 변경사항 (모든 서비스에 영향)
          if echo "$changed_files" | grep -qE "^(build\.gradle|settings\.gradle|docker-compose\.yml|gradle/|\.github/workflows/)"; then
            services=(auth-service customer-service admin-service manager-service store-service order-service payment-service)
          fi
          
          # 최초 커밋이나 서비스가 없는 경우 모든 서비스 빌드
          if [ ${#services[@]} -eq 0 ]; then
            services=(auth-service customer-service admin-service manager-service store-service order-service payment-service)
          fi
          
          # JSON 배열로 변환
          services_json=$(printf '%s\n' "${services[@]}" | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services_json" >> $GITHUB_OUTPUT
          
          # Matrix 전략을 위한 형태로 변환
          matrix_json=$(printf '%s\n' "${services[@]}" | jq -R -s -c '{"service": split("\n")[:-1]}')
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          
          # 변경사항 여부
          if [ ${#services[@]} -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Detected services: $services_json"

  # 테스트 및 빌드
  test-and-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.detect-changes.outputs.matrix)}}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test ${{ matrix.service }}
        run: ./gradlew :${{ matrix.service }}:test
        continue-on-error: true

      - name: Build ${{ matrix.service }}
        run: ./gradlew :${{ matrix.service }}:bootJar

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}/build/reports/tests/
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}/build/libs/*.jar
          retention-days: 30

  # ECR에 Docker 이미지 빌드 및 푸시
  build-and-push-ecr:
    needs: [detect-changes, test-and-build]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.detect-changes.outputs.matrix)}}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}/build/libs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names eatcloud/${{ matrix.service }} || \
          aws ecr create-repository \
            --repository-name eatcloud/${{ matrix.service }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 짧은 SHA 값을 별도 스텝에서 생성
      - name: Generate short SHA
        id: short-sha
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/eatcloud/${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/eatcloud/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/eatcloud/${{ matrix.service }}:${{ steps.short-sha.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64

      - name: Scan image for vulnerabilities
        run: |
          aws ecr start-image-scan --repository-name eatcloud/${{ matrix.service }} --image-id imageTag=latest || true

  # Staging Blue/Green 배포 (develop 브랜치)
  deploy-staging-blue-green:
    needs: [detect-changes, build-and-push-ecr]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix: ${{fromJson(needs.detect-changes.outputs.matrix)}}
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 현재 활성 Target Group 확인 (가중치 기반)
      - name: Check Current Active Target Group
        id: check-tg
        run: |
          BLUE_TG="${{ matrix.service }}-tg"
          GREEN_TG="${{ matrix.service }}-greentg"
          
          echo "🔍 Looking for ALB rules for service: ${{ matrix.service }}"
          echo "Blue TG: $BLUE_TG"
          echo "Green TG: $GREEN_TG"
          
          # ALB ARN 가져오기
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?LoadBalancerName=='eatcloud-internal-alb'].LoadBalancerArn" \
            --output text)
          
          if [ -z "$ALB_ARN" ]; then
            echo "❌ ALB 'eatcloud-internal-alb' not found"
            exit 1
          fi
          
          echo "🔗 Found ALB: $ALB_ARN"
          
          # Listener ARN 가져오기 (HTTP Listener)
          LISTENER_ARN=$(aws elbv2 describe-listeners \
            --load-balancer-arn "$ALB_ARN" \
            --query "Listeners[?Protocol=='HTTP'].ListenerArn" \
            --output text)
          
          if [ -z "$LISTENER_ARN" ]; then
            echo "❌ HTTP Listener not found"
            exit 1
          fi
          
          echo "👂 Found Listener: $LISTENER_ARN"
          
          # 해당 서비스의 모든 Rules 찾기
          SERVICE_PATH="/api/v1/${{ matrix.service }}/*"
          if [ "${{ matrix.service }}" = "admin-service" ]; then
            SERVICE_PATH="/api/v1/admin/*"
          elif [ "${{ matrix.service }}" = "auth-service" ]; then
            SERVICE_PATH="/api/v1/auth/*"
          elif [ "${{ matrix.service }}" = "customer-service" ]; then
            SERVICE_PATH="/api/v1/customer/*"
          elif [ "${{ matrix.service }}" = "manager-service" ]; then
            SERVICE_PATH="/api/v1/manager/*"
          elif [ "${{ matrix.service }}" = "store-service" ]; then
            SERVICE_PATH="/api/v1/store/*"
          elif [ "${{ matrix.service }}" = "order-service" ]; then
            SERVICE_PATH="/api/v1/order/*"
          elif [ "${{ matrix.service }}" = "payment-service" ]; then
            SERVICE_PATH="/api/v1/payment/*"
          fi
          
          echo "🔍 Looking for rules with path: $SERVICE_PATH"
          
          # 해당 서비스의 Rules 찾기
          RULES=$(aws elbv2 describe-rules \
            --listener-arn "$LISTENER_ARN" \
            --query "Rules[?Conditions[0].Values[0]=='${SERVICE_PATH}'].{RuleArn:RuleArn,Priority:Priority,Actions:Actions}" \
            --output json)
          
          echo "📋 Found rules for ${{ matrix.service }}:"
          echo "$RULES" | jq '.'
          
          # 현재 활성 규칙 찾기 (두 Target Group 중 어느 것이 100% weight인지 확인)
          ACTIVE_RULE=""
          INACTIVE_RULE=""
          ACTIVE_TG=""
          INACTIVE_TG=""
          CURRENT_STATE=""
          
          # 각 Rule을 순회하면서 가중치 확인
          for rule_arn in $(echo "$RULES" | jq -r '.[].RuleArn'); do
            echo "🔍 Checking rule: $rule_arn"
            
            # 해당 Rule의 Target Groups와 가중치 확인
            RULE_DETAILS=$(echo "$RULES" | jq ".[] | select(.RuleArn==\"$rule_arn\")")
            
            # Blue Target Group의 가중치
            BLUE_WEIGHT=$(echo "$RULE_DETAILS" | jq -r ".Actions[0].ForwardConfig.TargetGroups[] | select(.TargetGroupArn | contains(\"$BLUE_TG\")) | .Weight // 0")
            # Green Target Group의 가중치  
            GREEN_WEIGHT=$(echo "$RULE_DETAILS" | jq -r ".Actions[0].ForwardConfig.TargetGroups[] | select(.TargetGroupArn | contains(\"$GREEN_TG\")) | .Weight // 0")
            
            echo "  🔵 Blue Weight: ${BLUE_WEIGHT}%"
            echo "  🟢 Green Weight: ${GREEN_WEIGHT}%"
            
            # 현재 활성 상태 판단
            if [ "$BLUE_WEIGHT" = "100" ] && [ "$GREEN_WEIGHT" = "0" ]; then
              ACTIVE_RULE="$rule_arn"
              ACTIVE_TG="$BLUE_TG"
              INACTIVE_TG="$GREEN_TG"
              CURRENT_STATE="BLUE_ACTIVE"
              echo "  ✅ This rule has Blue active (100%)"
              break
            elif [ "$GREEN_WEIGHT" = "100" ] && [ "$BLUE_WEIGHT" = "0" ]; then
              ACTIVE_RULE="$rule_arn"
              ACTIVE_TG="$GREEN_TG"
              INACTIVE_TG="$BLUE_TG"
              CURRENT_STATE="GREEN_ACTIVE"
              echo "  ✅ This rule has Green active (100%)"
              break
            fi
          done
          
          if [ -z "$ACTIVE_RULE" ]; then
            echo "❌ No rule found with single target group at 100% weight"
            exit 1
          fi
          
          if [ "$CURRENT_STATE" = "BLUE_ACTIVE" ]; then
            echo "🔵 Current Active: Blue → Deploying to: Green"
          else
            echo "🟢 Current Active: Green → Deploying to: Blue"
          fi
          
          echo "ACTIVE_RULE=$ACTIVE_RULE" >> $GITHUB_OUTPUT
          echo "ACTIVE_TG=$ACTIVE_TG" >> $GITHUB_OUTPUT
          echo "INACTIVE_TG=$INACTIVE_TG" >> $GITHUB_OUTPUT
          echo "CURRENT_STATE=$CURRENT_STATE" >> $GITHUB_OUTPUT
          echo "ALB_ARN=$ALB_ARN" >> $GITHUB_OUTPUT
          echo "LISTENER_ARN=$LISTENER_ARN" >> $GITHUB_OUTPUT

      # 새 Task Definition 생성 및 비활성 환경 업데이트
      - name: Update Task Definition and Deploy to Inactive Environment
        id: task-def
        run: |
          # 현재 Task Definition 가져오기 (-staging 접미사 제거)
          TASK_DEF_NAME="eatcloud-${{ matrix.service }}"
          
          echo "🔍 Looking for task definition: $TASK_DEF_NAME"
          
          # Task Definition이 존재하는지 확인
          if ! aws ecs describe-task-definition --task-definition "$TASK_DEF_NAME" > /dev/null 2>&1; then
            echo "❌ Task definition '$TASK_DEF_NAME' not found!"
            echo "📋 Available task definitions for this service:"
            aws ecs list-task-definitions --family-prefix "eatcloud-${{ matrix.service }}" --query 'taskDefinitionArns' --output text
            exit 1
          fi
          
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_NAME" \
            --query 'taskDefinition' \
            --output json)
          
          # 새 이미지 URI로 Task Definition 업데이트
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/eatcloud/${{ matrix.service }}:${{ github.sha }}"
          
          echo $TASK_DEF | jq --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE | 
             del(.taskDefinitionArn) | del(.revision) | del(.status) | 
             del(.requiresAttributes) | del(.placementConstraints) | 
             del(.compatibilities) | del(.registeredAt) | del(.registeredBy)' > new-task-def.json
          
          # 새 Task Definition 등록
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          
          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "📋 New Task Definition: $NEW_TASK_DEF_ARN"
          
          # ECS 서비스 업데이트 (비활성 Target Group으로)
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_STAGING }} \
            --service ${{ matrix.service }} \
            --task-definition $NEW_TASK_DEF_ARN \
            --force-new-deployment

      # 배포 완료 대기 (개선된 버전)
      - name: Wait for New Version Deployment
        run: |
          echo "⏳ Waiting for new version to be deployed..."
          
          # 타임아웃 설정 (최대 10분)
          TIMEOUT=600
          ELAPSED=0
          INTERVAL=30
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            echo "🔍 Checking service status... (${ELAPSED}s/${TIMEOUT}s)"
            
            # 서비스 상태 확인
            SERVICE_INFO=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER_STAGING }} \
              --services ${{ matrix.service }} \
              --query 'services[0].{Status:status,RunningCount:runningCount,PendingCount:pendingCount,DesiredCount:desiredCount,TaskDefinition:taskDefinition}' \
              --output json)
            
            STATUS=$(echo "$SERVICE_INFO" | jq -r '.Status')
            RUNNING_COUNT=$(echo "$SERVICE_INFO" | jq -r '.RunningCount')
            PENDING_COUNT=$(echo "$SERVICE_INFO" | jq -r '.PendingCount')
            DESIRED_COUNT=$(echo "$SERVICE_INFO" | jq -r '.DesiredCount')
            
            echo "📊 Service Status: $STATUS, Running: $RUNNING_COUNT/$DESIRED_COUNT, Pending: $PENDING_COUNT"
            
            # 최근 서비스 이벤트 확인
            RECENT_EVENTS=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER_STAGING }} \
              --services ${{ matrix.service }} \
              --query 'services[0].events[0:3].{CreatedAt:createdAt,Message:message}' \
              --output json)
            
            echo "📝 Recent Events:"
            echo "$RECENT_EVENTS" | jq -r '.[] | "\(.CreatedAt): \(.Message)"'
            
            # 태스크 상태 확인
            TASK_ARNS=$(aws ecs list-tasks \
              --cluster ${{ env.ECS_CLUSTER_STAGING }} \
              --service-name ${{ matrix.service }} \
              --query 'taskArns' \
              --output text)
            
            if [ -n "$TASK_ARNS" ]; then
              TASK_STATUS=$(aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER_STAGING }} \
                --tasks $TASK_ARNS \
                --query 'tasks[].{TaskArn:taskArn,LastStatus:lastStatus,HealthStatus:healthStatus}' \
                --output json)
              
              echo "🏃 Task Status:"
              echo "$TASK_STATUS" | jq -r '.[] | "Task: \(.TaskArn | split("/")[2]), Status: \(.LastStatus), Health: \(.HealthStatus // "N/A")"'
              
              # 컨테이너 상태 확인
              CONTAINER_STATUS=$(aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER_STAGING }} \
                --tasks $TASK_ARNS \
                --query 'tasks[].containers[].{Name:name,LastStatus:lastStatus,ExitCode:exitCode,Reason:reason}' \
                --output json)
              
              echo "🐳 Container Status:"
              echo "$CONTAINER_STATUS" | jq -r '.[] | "Container: \(.Name), Status: \(.LastStatus), Exit Code: \(.ExitCode // "N/A"), Reason: \(.Reason // "N/A")"'
              
              # 실패한 태스크가 있는지 확인
              FAILED_TASKS=$(echo "$TASK_STATUS" | jq -r '.[] | select(.LastStatus == "STOPPED") | .TaskArn')
              if [ -n "$FAILED_TASKS" ]; then
                echo "❌ Found failed tasks, checking stop reason:"
                for task_arn in $FAILED_TASKS; do
                  STOP_REASON=$(aws ecs describe-tasks \
                    --cluster ${{ env.ECS_CLUSTER_STAGING }} \
                    --tasks "$task_arn" \
                    --query 'tasks[0].stopReason' \
                    --output text)
                  echo "Task $task_arn stopped: $STOP_REASON"
                done
              fi
            fi
            
            # 안정 상태 확인
            if [ "$STATUS" = "ACTIVE" ] && [ "$RUNNING_COUNT" = "$DESIRED_COUNT" ] && [ "$PENDING_COUNT" = "0" ]; then
              echo "✅ Service is stable!"
              break
            fi
            
            # 배포 실패 조건 확인
            if [ "$STATUS" != "ACTIVE" ]; then
              echo "❌ Service status is not ACTIVE: $STATUS"
              exit 1
            fi
            
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ Deployment timeout after ${TIMEOUT}s"
            echo "🔍 Final service state:"
            aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER_STAGING }} \
              --services ${{ matrix.service }} \
              --query 'services[0].{Status:status,RunningCount:runningCount,PendingCount:pendingCount,DesiredCount:desiredCount}' \
              --output table
            exit 1
          fi
          
          # 최종 상태 확인
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_STAGING }} \
            --services ${{ matrix.service }} \
            --query 'services[0].status' --output text)
          
          RUNNING_COUNT=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER_STAGING }} \
            --services ${{ matrix.service }} \
            --query 'services[0].runningCount' --output text)
          
          echo "✅ New version deployed successfully!"
          echo "📊 Final Status: $SERVICE_STATUS, Running Tasks: $RUNNING_COUNT"

      # 새 Task를 Target Group에 수동 등록 (간소화 버전)
      - name: Register New Tasks to Target Group
        run: |
          echo "🔄 Registering new tasks to inactive target group..."
          
          TARGET_TG_ARN=$(aws elbv2 describe-target-groups \
            --names "${{ steps.check-tg.outputs.INACTIVE_TG }}" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)
          
          # 서비스별 포트 매핑
          declare -A SERVICE_PORTS
          SERVICE_PORTS["auth-service"]=8081
          SERVICE_PORTS["admin-service"]=8083
          SERVICE_PORTS["customer-service"]=8082
          SERVICE_PORTS["manager-service"]=8084
          SERVICE_PORTS["store-service"]=8085
          SERVICE_PORTS["order-service"]=8086
          SERVICE_PORTS["payment-service"]=8087
          
          SERVICE_PORT=${SERVICE_PORTS["${{ matrix.service }}"]}
          
          if [ -z "$SERVICE_PORT" ]; then
            echo "❌ Unknown service: ${{ matrix.service }}"
            exit 1
          fi
          
          echo "🔌 Service Port: $SERVICE_PORT"
          
          # ECS 서비스가 안정화될 때까지 대기 (AWS CLI의 내장 waiter 사용)
          echo "⏳ Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER_STAGING }} \
            --services ${{ matrix.service }} \
            --cli-read-timeout 600
          
          # 실행 중인 Task들의 IP 추출 및 등록
          RUNNING_TASKS=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER_STAGING }} \
            --service-name ${{ matrix.service }} \
            --desired-status RUNNING \
            --query 'taskArns' \
            --output text)
          
          if [ -z "$RUNNING_TASKS" ]; then
            echo "❌ No running tasks found"
            exit 1
          fi
          
          echo "🏃 Found running tasks: $(echo $RUNNING_TASKS | wc -w) tasks"
          
          for task_arn in $RUNNING_TASKS; do
            PRIVATE_IP=$(aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER_STAGING }} \
              --tasks "$task_arn" \
              --query 'tasks[0].attachments[0].details[?name==`privateIPv4Address`].value' \
              --output text)
            
            if [ -n "$PRIVATE_IP" ] && [ "$PRIVATE_IP" != "None" ]; then
              echo "➕ Registering target: $PRIVATE_IP:$SERVICE_PORT"
              
              aws elbv2 register-targets \
                --target-group-arn "$TARGET_TG_ARN" \
                --targets Id="$PRIVATE_IP",Port="$SERVICE_PORT"
              
              if [ $? -eq 0 ]; then
                echo "✅ Successfully registered target: $PRIVATE_IP:$SERVICE_PORT"
              else
                echo "❌ Failed to register target: $PRIVATE_IP:$SERVICE_PORT"
              fi
            fi
          done
          
          echo "✅ Task registration completed"

      # ALB Rule 가중치 업데이트 (트래픽 전환) - 에러 핸들링 추가
      - name: Switch Traffic to New Version
        run: |
          echo "🔄 Switching traffic to new version using weighted routing..."
          
          # 비활성 Target Group ARN 가져오기
          INACTIVE_TG_ARN=$(aws elbv2 describe-target-groups \
            --names "${{ steps.check-tg.outputs.INACTIVE_TG }}" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)
          
          # 활성 Target Group ARN 가져오기
          ACTIVE_TG_ARN=$(aws elbv2 describe-target-groups \
            --names "${{ steps.check-tg.outputs.ACTIVE_TG }}" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)
          
          echo "🎯 Current Active TG ARN: $ACTIVE_TG_ARN"
          echo "🎯 Target Inactive TG ARN: $INACTIVE_TG_ARN"
          echo "📋 Active Rule: ${{ steps.check-tg.outputs.ACTIVE_RULE }}"
          echo "🔄 Current State: ${{ steps.check-tg.outputs.CURRENT_STATE }}"
          
          # 트래픽 전환 실행 (에러 캐치)
          echo "🔄 Switching traffic weights..."
          SWITCH_RESULT=$(aws elbv2 modify-rule \
            --rule-arn "${{ steps.check-tg.outputs.ACTIVE_RULE }}" \
            --actions Type=forward,ForwardConfig="{
              TargetGroups=[
                {
                  TargetGroupArn=\"$ACTIVE_TG_ARN\",
                  Weight=0
                },
                {
                  TargetGroupArn=\"$INACTIVE_TG_ARN\",
                  Weight=100
                }
              ]
            }" 2>&1)
          
          SWITCH_EXIT_CODE=$?
          if [ $SWITCH_EXIT_CODE -ne 0 ]; then
            echo "❌ Traffic switch failed: $SWITCH_RESULT"
            exit 1
          fi
          
          echo "✅ Traffic switched successfully to ${{ steps.check-tg.outputs.INACTIVE_TG }}"
          
          # 변경사항 확인
          sleep 3
          echo "🔍 Verifying traffic switch..."
          
          # 비활성 TG가 100%인지 확인
          INACTIVE_WEIGHT=$(aws elbv2 describe-rules \
            --rule-arns "${{ steps.check-tg.outputs.ACTIVE_RULE }}" \
            --query "Rules[0].Actions[0].ForwardConfig.TargetGroups[?TargetGroupArn=='$INACTIVE_TG_ARN'].Weight" \
            --output text)
          
          if [ "$INACTIVE_WEIGHT" = "100" ]; then
            echo "✅ Traffic switch verified - ${{ steps.check-tg.outputs.INACTIVE_TG }} now at 100%"
          else
            echo "❌ Traffic switch verification failed - Weight: $INACTIVE_WEIGHT"
            exit 1
          fi

      # 병렬 Health Check 및 이전 버전 정리 준비
      - name: Parallel Health Check and Cleanup Preparation
        run: |
          echo "🔄 Starting parallel health check and cleanup preparation..."
          
          TARGET_TG_ARN=$(aws elbv2 describe-target-groups \
            --names "${{ steps.check-tg.outputs.INACTIVE_TG }}" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)
          
          PREVIOUS_TG_ARN=$(aws elbv2 describe-target-groups \
            --names "${{ steps.check-tg.outputs.ACTIVE_TG }}" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)
          
          # Health check 함수
          health_check() {
            echo "🏥 Starting health check process..."
            for i in {1..20}; do
              HEALTHY_COUNT=$(aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_TG_ARN" \
                --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' \
                --output text)
              
              TOTAL_COUNT=$(aws elbv2 describe-target-health \
                --target-group-arn "$TARGET_TG_ARN" \
                --query 'length(TargetHealthDescriptions)' \
                --output text)
              
              echo "[Health Check $i/20] Status: $HEALTHY_COUNT/$TOTAL_COUNT targets healthy"
              
              if [ "$HEALTHY_COUNT" -gt 0 ] && [ "$HEALTHY_COUNT" = "$TOTAL_COUNT" ]; then
                echo "✅ All targets are healthy!"
                echo "HEALTH_CHECK_SUCCESS" > /tmp/health_status
                return 0
              fi
              
              if [ $i -eq 20 ]; then
                echo "❌ Health check failed after 20 attempts"
                echo "HEALTH_CHECK_FAILED" > /tmp/health_status
                return 1
              fi
              
              sleep 15
            done
          }
          
          # 이전 버전 Target 정보 수집 함수
          prepare_cleanup() {
            echo "🧹 Preparing cleanup information..."
            sleep 60  # Health check가 어느 정도 진행될 때까지 대기
            
            PREVIOUS_TARGETS=$(aws elbv2 describe-target-health \
              --target-group-arn "$PREVIOUS_TG_ARN" \
              --query 'TargetHealthDescriptions[].{Id:Target.Id,Port:Target.Port}' \
              --output json)
            
            echo "$PREVIOUS_TARGETS" > /tmp/cleanup_targets
            echo "📋 Cleanup targets prepared: $(echo $PREVIOUS_TARGETS | jq length) targets"
          }
          
          # 병렬 실행
          health_check &
          prepare_cleanup &
          
          wait  # 모든 백그라운드 작업 완료 대기
          
          # Health check 결과 확인
          if [ -f "/tmp/health_status" ]; then
            HEALTH_STATUS=$(cat /tmp/health_status)
            if [ "$HEALTH_STATUS" = "HEALTH_CHECK_FAILED" ]; then
              echo "❌ Health check failed, initiating rollback..."
              
              # 롤백 로직
              ACTIVE_TG_ARN=$(aws elbv2 describe-target-groups \
                --names "${{ steps.check-tg.outputs.ACTIVE_TG }}" \
                --query 'TargetGroups[0].TargetGroupArn' \
                --output text)
              
              aws elbv2 modify-rule \
                --rule-arn "${{ steps.check-tg.outputs.ACTIVE_RULE }}" \
                --actions Type=forward,ForwardConfig="{
                  TargetGroups=[
                    {
                      TargetGroupArn=\"$ACTIVE_TG_ARN\",
                      Weight=100
                    },
                    {
                      TargetGroupArn=\"$TARGET_TG_ARN\",
                      Weight=0
                    }
                  ]
                }"
              
              echo "🔄 Traffic rolled back to ${{ steps.check-tg.outputs.ACTIVE_TG }}"
              exit 1
            fi
          fi
          
          echo "✅ Parallel operations completed successfully"

  # Production 수동 배포 준비 알림
  production-deploy-ready:
    needs: [detect-changes, build-and-push-ecr]
    if: needs.detect-changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Production Blue/Green deployment notification
        run: |
          echo "🚀 Production Blue/Green deployment ready!"
          echo "Services: ${{ needs.detect-changes.outputs.services }}"
          echo "Image SHA: ${{ github.sha }}"
          echo "ECR Images:"
          echo "${{ needs.detect-changes.outputs.services }}" | jq -r '.[]' | while read service; do
            echo "  - ${{ env.ECR_REGISTRY }}/eatcloud/${service}:${{ github.sha }}"
          done
          echo ""
          echo "Blue/Green deployment features:"
          echo "  ✅ Zero-downtime deployment"
          echo "  ✅ Automatic health checks"
          echo "  ✅ Traffic switching with ALB Target Groups"  
          echo "  ✅ Instant rollback capability"
          echo ""
          echo "Target Groups per service:"
          echo "${{ needs.detect-changes.outputs.services }}" | jq -r '.[]' | while read service; do
            echo "  - ${service}: Blue (${service}-tg) ↔ Green (${service}-greentg)"
          done
          echo ""
          echo "To deploy to production:"
          echo "1. Go to Actions tab"
          echo "2. Run 'Deploy to Production (Blue/Green)' workflow"
          echo "3. Select services and image tag: ${{ github.sha }}"