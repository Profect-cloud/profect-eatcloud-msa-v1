# =============================================================================
# Database Common Configuration
# 모든 서비스에서 공통으로 사용하는 데이터베이스 설정
# =============================================================================

# PostgreSQL 공통 설정
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 공통 설정
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# 환경별 DB URL 패턴 (각 서비스에서 DB_NAME만 다르게 설정)
# Local: spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:${spring.application.name}_db}
# Docker/AWS: spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}

